<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание для Никитки</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ef4444'/></svg>">
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --accent: #3b82f6;
            --text: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Большая центральная кнопка (круглая) */
        .big-btn {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            width: 260px;
            height: 260px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4);
            transition: all 0.25s ease;
            text-align: center;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .big-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 45px rgba(239, 68, 68, 0.6);
        }

        .big-btn:active {
            transform: scale(0.98);
        }

        .big-btn.disabled {
            background: #475569 !important;
            box-shadow: none !important;
            cursor: not-allowed !important;
            transform: none !important;
            opacity: 0.65 !important;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-title {
            font-size: 1.6em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.95em;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: var(--text);
            padding: 16px;
            font-size: 1.05em;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-cancel {
            background: #334155;
            color: var(--text);
        }
        .btn-cancel:hover { background: #475569; }

        .btn-submit {
            background: var(--accent);
            color: white;
        }
        .btn-submit:hover { background: #2563eb; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg {
            margin-top: 15px;
            font-size: 0.95em;
            text-align: center;
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            /* Оптимизация для мобильных: убираем backdrop-filter, используем плотный цвет */
            .modal-overlay {
                background: rgba(15, 23, 42, 0.96) !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
            .floating-task {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                background: #1e293b !important;
            }
            /* Скрываем фоновые плавающие задания при открытых модальных окнах */
            body.modal-open #floatingContainer {
                display: none !important;
            }
            .big-btn {
                width: 210px;
                height: 210px;
                font-size: 1.4rem;
            }
            .modal-overlay {
                padding: 10px;
            }
            .modal {
                padding: 20px 16px;
                border-radius: 16px;
            }
            .feed-modal {
                height: 94vh !important;
                max-height: 94vh !important;
                padding: 16px 12px !important;
            }
            .feed-item {
                padding: 12px !important;
                border-radius: 10px !important;
            }
            .feed-item-text {
                font-size: 0.98rem !important;
            }
            .feed-item-footer {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 8px;
            }
            .feed-actions {
                width: 100%;
                justify-content: flex-end;
            }
            .bottom-feed-btn {
                bottom: 16px;
                padding: 10px 22px;
                font-size: 0.95rem;
            }
        }

        /* Контейнер и анимация падающих заданий на фоне */
        #floatingContainer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-task {
            position: absolute;
            max-width: 280px;
            padding: 10px 16px;
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: rgba(248, 250, 252, 0.7);
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            opacity: 0;
            animation: appearFloatFade 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        /* Подсветка только что опубликованного задания */
        .floating-task.highlight-new {
            background: rgba(30, 25, 10, 0.88);
            border: 2px solid #facc15;
            color: #fef08a;
            font-weight: 600;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.75), 0 8px 25px rgba(0, 0, 0, 0.5);
            animation: appearFloatFade 7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 5;
        }

        @keyframes appearFloatFade {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(0);
            }
            15% {
                opacity: 0.85;
                transform: scale(1) translateY(10px);
            }
            70% {
                opacity: 0.7;
                transform: scale(1) translateY(45px);
            }
            100% {
                opacity: 0;
                transform: scale(0.95) translateY(75px);
            }
        }

        /* Полупрозрачная кнопка снизу экрана */
        .bottom-feed-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            padding: 12px 28px;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .bottom-feed-btn:hover {
            background: rgba(51, 65, 85, 0.85);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.45);
        }

        /* Модальное окно списка заданий */
        .feed-modal {
            max-width: 650px;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Контекстное меню сортировки */
        .sort-dropdown-wrap {
            position: relative;
            display: inline-block;
        }

        .sort-dropdown-btn {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .sort-dropdown-btn:hover {
            border-color: #475569;
            background: #1e293b;
        }

        .sort-arrow {
            font-size: 0.75em;
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .sort-dropdown-wrap.open .sort-arrow {
            transform: rotate(180deg);
        }

        .sort-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
            display: none;
            flex-direction: column;
            gap: 2px;
            min-width: 140px;
            z-index: 50;
            animation: fadeIn 0.15s ease;
        }

        .sort-dropdown-wrap.open .sort-menu {
            display: flex;
        }

        .sort-menu-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-align: left;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }

        .sort-menu-item:hover {
            background: #334155;
            color: #fff;
        }

        .sort-menu-item.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        /* Список заданий */
        .feed-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Плавный инерционный скролл для iOS/Safari */
            overscroll-behavior-y: contain;   /* Изоляция скролла от страницы */
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
            margin-top: 10px;
            contain: content;                 /* Изолирует перерисовки внутри списка */
            transform: translateZ(0);         /* Включение аппаратного ускорения GPU */
        }

        .feed-list::-webkit-scrollbar {
            width: 6px;
        }
        .feed-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .feed-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            contain: layout style;            /* Оптимизация рендеринга для браузера */
            will-change: transform;
        }

        .feed-item-text {
            font-size: 1.05rem;
            line-height: 1.45;
            color: #f1f5f9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .feed-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
        }

        .feed-time {
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .feed-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Кнопка лайка */
        .vote-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #475569;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .vote-btn:hover {
            border-color: #f43f5e;
            color: #f43f5e;
        }

        .vote-btn.active {
            background: rgba(244, 63, 94, 0.15);
            border-color: #f43f5e;
            color: #f43f5e;
        }

        /* Кнопка пожаловаться */
        .report-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #475569;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .report-btn:hover {
            border-color: #eab308;
            color: #eab308;
        }

        .report-btn.active {
            background: rgba(234, 179, 8, 0.15);
            border-color: #eab308;
            color: #facc15;
            cursor: default;
        }

        .close-feed-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }
        .close-feed-btn:hover { color: #fff; }

        /* Красивая анимация серых блоков загрузки (скелетоны) */
        .skeleton-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .skeleton-line {
            height: 14px;
            background: #1e293b;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-line.w-80 { width: 80%; height: 16px; }
        .skeleton-line.w-50 { width: 50%; height: 16px; }
        .skeleton-btn { width: 60px; height: 32px; background: #1e293b; border-radius: 8px; position: relative; overflow: hidden; }

        .shimmer::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: skeletonShimmer 1.4s infinite;
        }

        @keyframes skeletonShimmer {
            100% { transform: translateX(100%); }
        }

        .feed-item.highlight-live {
            animation: liveFlash 1.5s ease-out;
        }

        @keyframes liveFlash {
            0% { border-color: #38bdf8; box-shadow: 0 0 16px rgba(56, 189, 248, 0.4); }
            100% { border-color: #334155; box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- Большая кнопка по центру -->
    <div id="floatingContainer"></div>
    <button class="big-btn" id="giveTaskBtn" onclick="openModal()">
        <span style="font-size: 2.2rem; line-height: 1;">🐸</span>
        <span>Дать задание</span>
    </button>

    <!-- Полупрозрачная кнопка списка заданий снизу -->
    <button class="bottom-feed-btn" onclick="openFeedModal()">
        <span>Список заданий</span>
    </button>

    <!-- Модальное окно списка заданий -->
    <div class="modal-overlay" id="feedModalOverlay" onclick="handleFeedOverlayClick(event)">
        <div class="modal feed-modal">
            <div class="feed-header">
                <div>
                    <h2 class="modal-title" style="margin-bottom: 2px;">Список заданий 🔥</h2>
                    <p class="modal-subtitle" style="margin-bottom: 0;">Голосуй за лучшие идеи или предлагай свои</p>
                </div>
                <button class="close-feed-btn" onclick="closeFeedModal()">✕</button>
            </div>

            <div class="sort-dropdown-wrap" id="sortDropdownWrap">
                <button class="sort-dropdown-btn" id="sortDropdownBtn" onclick="toggleSortDropdown(event)">
                    <span id="currentSortLabel">🔥 Лучшие</span>
                    <span class="sort-arrow">▼</span>
                </button>
                <div class="sort-menu" id="sortMenu">
                    <button class="sort-menu-item active" id="sortOpt-top" onclick="selectFeedSort('top')">🔥 Лучшие</button>
                    <button class="sort-menu-item" id="sortOpt-new" onclick="selectFeedSort('new')">🕒 Свежие</button>
                </div>
            </div>

            <div class="feed-list" id="feedList"></div>
        </div>
    </div>

    <!-- Всплывающее окно -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <h2 class="modal-title">Твоя безумная идея 💡</h2>
            <p class="modal-subtitle">Напиши задание или вызов, который thebreakhikita должен выполнить.</p>
            
            <textarea id="taskInput" placeholder="Например: Сделай сальто" maxlength="2000"></textarea>
            
            <div id="statusMsg" class="status-msg"></div>

            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-submit" id="submitBtn" onclick="sendTask()">Отправить 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const modalOverlay = document.getElementById('modalOverlay');
        const floatingContainer = document.getElementById('floatingContainer');
        let backgroundTasks = [];
        let taskQueue = []; // Очередь не показанных заданий

        // Функция случайного перемешивания массива (Фишер-Йетс)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getNextTask() {
            if (backgroundTasks.length === 0) return null;

            if (taskQueue.length === 0) {
                taskQueue = shuffleArray(backgroundTasks);
            }

            return taskQueue.shift();
        }

        // Базовые примеры на случай, если база данных пока пуста
        const fallbackTasks = [
            "Напиши задание",
            "Никита хочет задание",
            "Тут будет всплывать твое задание",
            "Давай чего ты ждешь?",
            "Хочу тебя",
            "67"
        ];

        async function fetchBackgroundTasks() {
            try {
                const res = await fetch('/api/public-tasks');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        backgroundTasks = data.map(item => item.text);
                    }
                }
            } catch (e) {
                console.log('Используются дефолтные подсказки на фоне');
            }
            if (backgroundTasks.length === 0) {
                backgroundTasks = [...fallbackTasks];
            }
        }

        function spawnFloatingTask(customText = null, isHighlight = false) {
            // Не создаем фоновые элементы, если открыто модальное окно (экономит CPU и FPS)
            if (document.body.classList.contains('modal-open') && !customText) return;

            // Если передан customText — используем его, иначе берём из очереди
            const currentText = customText || getNextTask();
            if (!currentText) return;
            
            const item = document.createElement('div');
            item.className = 'floating-task' + (isHighlight ? ' highlight-new' : '');
            // Обрезаем слишком длинные фразы, чтобы фон оставался аккуратным
            item.innerText = currentText.length > 80 ? currentText.slice(0, 80) + '...' : currentText;

            // Временно скрываем для вычисления точных размеров плашки
            item.style.visibility = 'hidden';
            floatingContainer.appendChild(item);

            const cardWidth = item.offsetWidth || 220;
            const cardHeight = item.offsetHeight || 50;

            // Динамически получаем текущие координаты и размеры кнопки на экране
            const btn = document.querySelector('.big-btn');
            const btnRect = btn ? btn.getBoundingClientRect() : { left: 0, right: 0, top: 0, bottom: 0 };

            const margin = 20; // Безопасный отступ вокруг кнопки
            const animFallDistance = 75; // Расстояние, на которое карточка смещается вниз по анимации

            const maxW = Math.max(10, window.innerWidth - cardWidth - 20);
            const maxH = Math.max(10, window.innerHeight - cardHeight - animFallDistance - 20);

            let posX = 10;
            let posY = 10;
            let positionFound = false;

            // Пробуем подобрать координаты без пересечения с кнопкой
            for (let i = 0; i < 30; i++) {
                const testX = Math.floor(Math.random() * maxW) + 10;
                const testY = Math.floor(Math.random() * maxH) + 10;

                // Проверка пересечения плашки и траектории её падения с областью кнопки
                const overlapX = testX < (btnRect.right + margin) && (testX + cardWidth) > (btnRect.left - margin);
                const overlapY = testY < (btnRect.bottom + margin) && (testY + cardHeight + animFallDistance) > (btnRect.top - margin);

                if (!overlapX || !overlapY) {
                    posX = testX;
                    posY = testY;
                    positionFound = true;
                    break;
                }
            }

            // Если свободное место не нашлось (например, экран перегружен)
            if (!positionFound) {
                item.remove();
                if (!customText) taskQueue.unshift(currentText);
                return;
            }

            item.style.left = `${posX}px`;
            item.style.top = `${posY}px`;
            item.style.visibility = 'visible';

            // Новое задание задерживается на экране дольше (7 сек против 5 сек)
            const duration = isHighlight ? 7000 : 5000;
            setTimeout(() => {
                item.remove();
            }, duration);
        }

        // Запуск загрузки и интервала появления (каждые 1.8 секунды)
        fetchBackgroundTasks().then(() => {
            spawnFloatingTask();
            setInterval(spawnFloatingTask, 2000);
        });
        // ЛОГИКА СПИСКА ЗАДАНИЙ, ГОЛОСОВАНИЯ И ЖАЛОБ
        const feedModalOverlay = document.getElementById('feedModalOverlay');
        const feedList = document.getElementById('feedList');
        let currentFeedSort = 'top';
        let currentFeedData = []; // Локальный кэш списка
        let hasInitialLoaded = false;
        let eventSource = null;

        // Локальное кэширование действий пользователя
        function getLocalActionIds(key) {
            try { return JSON.parse(localStorage.getItem(key)) || []; }
            catch(e) { return []; }
        }

        function addLocalActionId(key, id) {
            const list = getLocalActionIds(key);
            if (!list.includes(id)) {
                list.push(id);
                localStorage.setItem(key, JSON.stringify(list));
            }
        }

        function removeLocalActionId(key, id) {
            let list = getLocalActionIds(key);
            list = list.filter(item => item !== id);
            localStorage.setItem(key, JSON.stringify(list));
        }

        // Рендер серых блоков-скелетонов при первичной загрузке
        function showSkeletons() {
            feedList.innerHTML = Array(4).fill(0).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-line w-80 shimmer"></div>
                    <div class="skeleton-line w-50 shimmer"></div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                        <div class="skeleton-line shimmer" style="width: 70px; height: 12px;"></div>
                        <div style="display: flex; gap: 8px;">
                            <div class="skeleton-btn shimmer"></div>
                            <div class="skeleton-btn shimmer"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openFeedModal() {
            document.body.classList.add('modal-open');
            feedModalOverlay.classList.add('active');
            // Если данные уже есть — не дергаем повторно надписи и скелетоны
            if (!hasInitialLoaded) {
                loadFeed(true);
            }
        }

        function closeFeedModal() {
            document.body.classList.remove('modal-open');
            feedModalOverlay.classList.remove('active');
        }

        function handleFeedOverlayClick(e) {
            if (e.target === feedModalOverlay) closeFeedModal();
        }

        function toggleSortDropdown(e) {
            e.stopPropagation();
            document.getElementById('sortDropdownWrap').classList.toggle('open');
        }

        function selectFeedSort(sort) {
            document.getElementById('sortDropdownWrap').classList.remove('open');
            if (currentFeedSort === sort) return;

            currentFeedSort = sort;
            document.getElementById('currentSortLabel').innerText = sort === 'top' ? '🔥 Лучшие' : '🕒 Свежие';

            document.getElementById('sortOpt-top').classList.toggle('active', sort === 'top');
            document.getElementById('sortOpt-new').classList.toggle('active', sort === 'new');

            // При смене сортировки плавно пересортировываем уже имеющийся массив без скелетона
            sortAndRenderFeed();
        }

        document.addEventListener('click', (e) => {
            const wrap = document.getElementById('sortDropdownWrap');
            if (wrap && !wrap.contains(e.target)) {
                wrap.classList.remove('open');
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function createFeedCardHtml(task) {
            const localVotes = getLocalActionIds('client_voted_tasks');
            const isVoted = task.hasVoted || localVotes.includes(task.id);
            const isReported = Boolean(task.hasReported);
            const date = new Date(task.created_at).toLocaleString('ru-RU', {
                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
            });

            return `
            <div class="feed-item" id="feed-item-${task.id}" data-id="${task.id}" data-likes="${task.likes_count || 0}" data-time="${new Date(task.created_at).getTime()}">
                <div class="feed-item-text">${escapeHtml(task.text)}</div>
                <div class="feed-item-footer">
                    <span class="feed-time">${date}</span>
                    <div class="feed-actions">
                        <button class="vote-btn ${isVoted ? 'active' : ''}" id="vote-btn-${task.id}" onclick="toggleVote(${task.id})">
                            <span>❤️</span>
                            <span id="vote-count-${task.id}">${task.likes_count || 0}</span>
                        </button>
                        <button class="report-btn ${isReported ? 'active' : ''}" id="report-btn-${task.id}" onclick="reportTask(${task.id})">
                            <span>⚠️</span>
                            <span id="report-count-${task.id}">${task.reports_count > 0 ? task.reports_count : 'Пожаловаться'}</span>
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function sortAndRenderFeed() {
            if (currentFeedSort === 'top') {
                currentFeedData.sort((a, b) => (b.likes_count || 0) - (a.likes_count || 0) || new Date(b.created_at) - new Date(a.created_at));
            } else {
                currentFeedData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            }

            if (!currentFeedData.length) {
                feedList.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px;">Заданий пока нет 😴</div>';
                return;
            }

            feedList.innerHTML = currentFeedData.map(createFeedCardHtml).join('');
        }

        async function loadFeed(isInitial = false) {
            if (isInitial && !hasInitialLoaded) {
                showSkeletons();
            }

            try {
                const res = await fetch(`/api/feed-tasks?sort=${currentFeedSort}`);
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');

                currentFeedData = Array.isArray(data) ? data : [];
                hasInitialLoaded = true;

                const localReports = getLocalActionIds('client_reported_tasks');
                currentFeedData.forEach(task => {
                    if (!task.hasReported && localReports.includes(task.id)) {
                        removeLocalActionId('client_reported_tasks', task.id);
                    }
                });

                sortAndRenderFeed();
            } catch (err) {
                console.error('Ошибка ленты:', err);
                if (!hasInitialLoaded) {
                    feedList.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 40px;">Ошибка: ${escapeHtml(err.message)}</div>`;
                }
            }
        }

        // Подключение SSE: обновления в реальном времени для всех
        function initRealtimeFeed() {
            if (eventSource) return;

            eventSource = new EventSource('/api/feed-stream');

            eventSource.onmessage = (event) => {
                try {
                    const { type, payload } = JSON.parse(event.data);

                    if (type === 'new_task') {
                        handleRealtimeNewTask(payload);
                    } else if (type === 'vote_update') {
                    } else if (type === 'submissions_toggle') {
                        updateSubmissionsUI(payload.enabled);
                        handleRealtimeVoteUpdate(payload);
                    } else if (type === 'report_update') {
                        handleRealtimeReportUpdate(payload);
                    } else if (type === 'task_deleted') {
                        handleRealtimeDelete(payload);
                    }
                } catch (e) {
                    console.error('Ошибка разбора real-time события:', e);
                }
            };

            eventSource.onerror = () => {
                // Браузер сам автоматически восстановит SSE-соединение
            };
        }

        // Обработка нового задания
        function handleRealtimeNewTask(task) {
            if (currentFeedData.some(t => t.id === task.id)) return;

            currentFeedData.push(task);

            // Если список был пуст — очищаем заглушку
            if (feedList.children.length === 1 && !feedList.children[0].classList.contains('feed-item')) {
                feedList.innerHTML = '';
            }

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = createFeedCardHtml(task);
            const cardEl = tempDiv.firstElementChild;
            cardEl.classList.add('highlight-live');

            if (currentFeedSort === 'new') {
                // В режиме "Свежие" новое задание всегда мгновенно падает на самый верх
                feedList.prepend(cardEl);
            } else {
                // В режиме "Лучшие" новое задание с 0 лайков добавляется в конец
                feedList.appendChild(cardEl);
            }
        }

        // Обработка изменения голосов (лайков)
        function handleRealtimeVoteUpdate({ id, likes_count }) {
            const task = currentFeedData.find(t => t.id === id);
            if (task) {
                task.likes_count = likes_count;
            }

            const countEl = document.getElementById(`vote-count-${id}`);
            if (countEl) countEl.innerText = likes_count;

            const card = document.getElementById(`feed-item-${id}`);
            if (card) {
                card.setAttribute('data-likes', likes_count);

                // Если сортировка "🔥 Лучшие" — перемещаем карточку наверх, если она обогнала другие
                if (currentFeedSort === 'top') {
                    reorderCardInTopFeed(card, likes_count, task ? new Date(task.created_at).getTime() : 0);
                }
            }
        }

        // Плавная перестановка карточки на её правильное место в топе (как вверх, так и вниз)
        function reorderCardInTopFeed(card, likes, taskTime) {
            const items = Array.from(feedList.querySelectorAll('.feed-item'));
            if (!items.includes(card)) return;

            // Находим карточку, перед которой должно стоять текущее задание
            let target = null;
            for (const item of items) {
                if (item === card) continue;

                const iLikes = parseInt(item.getAttribute('data-likes') || '0', 10);
                const iTime = parseInt(item.getAttribute('data-time') || '0', 10);

                // Задание выше, если у него больше лайков, либо при равенстве лайков оно создано позже
                const isHigher = (likes > iLikes) || (likes === iLikes && taskTime > iTime);
                if (isHigher) {
                    target = item;
                    break;
                }
            }

            let moved = false;

            if (target) {
                // Если позиция изменилась, вставляем перед найденной карточкой
                if (card.nextElementSibling !== target) {
                    feedList.insertBefore(card, target);
                    moved = true;
                }
            } else {
                // Если задание уступает всем по лайкам — опускаем в самый конец списка
                if (card !== feedList.lastElementChild) {
                    feedList.appendChild(card);
                    moved = true;
                }
            }

            // Перезапуск эффекта анимации при смене позиции
            if (moved) {
                card.classList.remove('highlight-live');
                void card.offsetWidth;
                card.classList.add('highlight-live');
            }
        }

        // Обработка изменения репортов
        function handleRealtimeReportUpdate({ id, reports_count }) {
            const task = currentFeedData.find(t => t.id === id);
            if (task) task.reports_count = reports_count;

            const countEl = document.getElementById(`report-count-${id}`);
            if (countEl) countEl.innerText = reports_count > 0 ? reports_count : 'Пожаловаться';
        }

        // Обработка удаления задания админом
        function handleRealtimeDelete({ id }) {
            currentFeedData = currentFeedData.filter(t => t.id !== id);
            const card = document.getElementById(`feed-item-${id}`);
            if (card) card.remove();

            if (!currentFeedData.length) {
                feedList.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px;">Заданий пока нет 😴</div>';
            }
        }

        // Запускаем подключение SSE сразу при загрузке страницы
        initRealtimeFeed();

        async function toggleVote(taskId) {
            const btn = document.getElementById(`vote-btn-${taskId}`);
            const countEl = document.getElementById(`vote-count-${taskId}`);

            try {
                const res = await fetch(`/api/tasks/${taskId}/vote`, { method: 'POST' });
                const data = await res.json();

                if (res.ok && data.success) {
                    countEl.innerText = data.likes_count;
                    if (data.hasVoted) {
                        btn.classList.add('active');
                        addLocalActionId('client_voted_tasks', taskId);
                    } else {
                        btn.classList.remove('active');
                        removeLocalActionId('client_voted_tasks', taskId);
                    }
                    // Мгновенно пересортировываем задание на клиенте (вверх при лайке или вниз при снятии)
                    handleRealtimeVoteUpdate({ id: taskId, likes_count: data.likes_count });
                }
            } catch (err) {
                console.error('Ошибка при голосовании', err);
            }
        }

        async function reportTask(taskId) {
            const btn = document.getElementById(`report-btn-${taskId}`);
            const countEl = document.getElementById(`report-count-${taskId}`);

            if (btn.classList.contains('active')) {
                alert('Вы уже пожаловались на это задание!');
                return;
            }

            if (!confirm('Вы действительно хотите пожаловаться на это задание?')) return;

            try {
                const res = await fetch(`/api/tasks/${taskId}/report`, { method: 'POST' });
                const data = await res.json();

                if (res.ok && data.success) {
                    btn.classList.add('active');
                    countEl.innerText = data.reports_count;
                    addLocalActionId('client_reported_tasks', taskId);
                    alert('Жалоба отправлена администратору');
                } else {
                    alert(data.error || 'Ошибка при отправке жалобы');
                }
            } catch (err) {
                alert('Ошибка соединения');
            }
        }
        
        const taskInput = document.getElementById('taskInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        let isSubmissionsEnabled = true;

        function updateSubmissionsUI(enabled) {
            isSubmissionsEnabled = enabled;
            const btn = document.getElementById('giveTaskBtn');
            if (!btn) return;

            if (enabled) {
                btn.classList.remove('disabled');
                btn.title = '';
            } else {
                btn.classList.add('disabled');
                btn.title = 'Приём заданий временно приостановлен';
            }
        }

        async function fetchSubmissionsStatus() {
            try {
                const res = await fetch('/api/submissions-status');
                if (res.ok) {
                    const data = await res.json();
                    updateSubmissionsUI(data.enabled);
                }
            } catch (e) {}
        }
        fetchSubmissionsStatus();

        function openModal() {
            if (!isSubmissionsEnabled) return;
            document.body.classList.add('modal-open');
            modalOverlay.classList.add('active');
            taskInput.focus();
        }

        function closeModal() {
            document.body.classList.remove('modal-open');
            modalOverlay.classList.remove('active');
            taskInput.value = '';
            statusMsg.style.display = 'none';
        }

        function handleOverlayClick(e) {
            if (e.target === modalOverlay) closeModal();
        }

        // Проверка локального кулдауна в браузере (1 минута)
        function checkBrowserCooldown() {
            const lastSent = parseInt(localStorage.getItem('last_task_sent_time') || '0', 10);
            const now = Date.now();
            const elapsed = now - lastSent;
            const cooldown = 60 * 1000;

            if (elapsed < cooldown) {
                return Math.ceil((cooldown - elapsed) / 1000);
            }
            return 0;
        }

        async function sendTask() {
            const text = taskInput.value.trim();
            if (!text) {
                alert('Пожалуйста, напишите хоть что-нибудь!');
                return;
            }

            // Проверка по браузеру перед отправкой запроса
            const browserWait = checkBrowserCooldown();
            if (browserWait > 0) {
                statusMsg.style.display = 'block';
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = `⏳ Вы можете отправить следующее задание через ${browserWait} сек.`;
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    statusMsg.style.display = 'block';
                    statusMsg.style.color = '#4ade80';
                    statusMsg.innerText = '✅ Задание отправлено блогеру!';
                    localStorage.setItem('last_task_sent_time', Date.now().toString());
                    
                    // Сразу добавляем новое задание в общий пул и в начало очереди
                    backgroundTasks.unshift(text);
                    taskQueue.unshift(text);
                    
                    taskInput.value = '';
                    
                    // Закрываем модальное окно и сразу спавним подсвеченное жёлтым задание на экране
                    setTimeout(() => {
                        closeModal();
                        spawnFloatingTask(text, true);
                    }, 1200);
                } else {
                    throw new Error(data.error || 'Ошибка отправки');
                }
            } catch (err) {
                statusMsg.style.display = 'block';
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = '❌ Ошибка: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить 🚀';
            }
        }
    </script>
</body>
</html>

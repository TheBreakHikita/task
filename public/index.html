<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание для Никитки</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ef4444'/></svg>">
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --accent: #3b82f6;
            --text: #f8fafc; --text-muted: #94a3b8; --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Большая центральная кнопка (круглая) */
        .big-btn {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            width: 260px;
            height: 260px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4);
            transition: all 0.25s ease;
            text-align: center;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .big-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 45px rgba(239, 68, 68, 0.6);
        }

        .big-btn:active {
            transform: scale(0.98);
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-title {
            font-size: 1.6em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.95em;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: var(--text);
            padding: 16px;
            font-size: 1.05em;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-cancel {
            background: #334155;
            color: var(--text);
        }
        .btn-cancel:hover { background: #475569; }

        .btn-submit {
            background: var(--accent);
            color: white;
        }
        .btn-submit:hover { background: #2563eb; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-msg {
            margin-top: 15px;
            font-size: 0.95em;
            text-align: center;
            display: none;
        }

        @media (max-width: 600px) {
            .big-btn {
                width: 200px;
                height: 200px;
                font-size: 1.3rem;
            }
        }

        /* Контейнер и анимация падающих заданий на фоне */
        #floatingContainer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-task {
            position: absolute;
            max-width: 280px;
            padding: 10px 16px;
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: rgba(248, 250, 252, 0.7);
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            opacity: 0;
            animation: appearFloatFade 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        @keyframes appearFloatFade {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(0);
            }
            15% {
                opacity: 0.85;
                transform: scale(1) translateY(10px);
            }
            70% {
                opacity: 0.7;
                transform: scale(1) translateY(45px);
            }
            100% {
                opacity: 0;
                transform: scale(0.95) translateY(75px);
            }
        }
    </style>
</head>
<body>

    <!-- Большая кнопка по центру -->
    <div id="floatingContainer"></div>
    <button class="big-btn" onclick="openModal()">
        <span style="font-size: 2.2rem; line-height: 1;">🐸</span>
        <span>Дать задание</span>
    </button>

    <!-- Всплывающее окно -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <h2 class="modal-title">Твоя безумная идея 💡</h2>
            <p class="modal-subtitle">Напиши задание или вызов, который thebreakhikita должен выполнить.</p>
            
            <textarea id="taskInput" placeholder="Например: Сделай сальто" maxlength="2000"></textarea>
            
            <div id="statusMsg" class="status-msg"></div>

            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-submit" id="submitBtn" onclick="sendTask()">Отправить 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const modalOverlay = document.getElementById('modalOverlay');
        const floatingContainer = document.getElementById('floatingContainer');
        let backgroundTasks = [];

        // Базовые примеры на случай, если база данных пока пуста
        const fallbackTasks = [
            "Прыгни с парашютом",
            "Позвони случайному номеру",
            "Сделай 50 отжиманий прямо сейчас",
            "Съешь ложку корицы",
            "Проведи стрим 24 часа"
        ];

        async function fetchBackgroundTasks() {
            try {
                const res = await fetch('/api/public-tasks');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) {
                        backgroundTasks = data.map(item => item.text);
                    }
                }
            } catch (e) {
                console.log('Используются дефолтные подсказки на фоне');
            }
            if (backgroundTasks.length === 0) {
                backgroundTasks = [...fallbackTasks];
            }
        }

        function spawnFloatingTask() {
            if (backgroundTasks.length === 0) return;

            // Выбираем случайное задание
            const randomText = backgroundTasks[Math.floor(Math.random() * backgroundTasks.length)];
            
            const item = document.createElement('div');
            item.className = 'floating-task';
            // Обрезаем слишком длинные фразы, чтобы фон оставался аккуратным
            item.innerText = randomText.length > 80 ? randomText.slice(0, 80) + '...' : randomText;

            // Случайные координаты по экрану (с отступами от краёв)
            const x = Math.floor(Math.random() * 75) + 5; // 5% - 80% ширины
            const y = Math.floor(Math.random() * 70) + 5; // 5% - 75% высоты

            item.style.left = `${x}%`;
            item.style.top = `${y}%`;

            floatingContainer.appendChild(item);

            // Удаляем элемент из DOM после окончания анимации (5 секунд)
            setTimeout(() => {
                item.remove();
            }, 5000);
        }

        // Запуск загрузки и интервала появления (каждые 1.8 секунды)
        fetchBackgroundTasks().then(() => {
            spawnFloatingTask();
            setInterval(spawnFloatingTask, 2500);
        });
        const taskInput = document.getElementById('taskInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        function openModal() {
            modalOverlay.classList.add('active');
            taskInput.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            taskInput.value = '';
            statusMsg.style.display = 'none';
        }

        function handleOverlayClick(e) {
            if (e.target === modalOverlay) closeModal();
        }

        async function sendTask() {
            const text = taskInput.value.trim();
            if (!text) {
                alert('Пожалуйста, напишите хоть что-нибудь!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    statusMsg.style.display = 'block';
                    statusMsg.style.color = '#4ade80';
                    statusMsg.innerText = '✅ Задание отправлено блогеру!';
                    
                    // Сразу добавляем новое задание в пул на фон
                    backgroundTasks.unshift(text);
                    
                    taskInput.value = '';
                    setTimeout(closeModal, 1500);
                } else {
                    throw new Error(data.error || 'Ошибка отправки');
                }
            } catch (err) {
                statusMsg.style.display = 'block';
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = '❌ Ошибка: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить 🚀';
            }
        }
    </script>
</body>
</html>

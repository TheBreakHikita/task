<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — Задания</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%233b82f6'/></svg>">
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --accent: #3b82f6; 
            --danger: #ef4444; --text: #f8fafc; --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 30px 20px; }
        .container { max-width: 900px; margin: 0 auto; }

        /* Авторизация */
        #loginScreen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--surface); padding: 40px; border-radius: 16px; border: 1px solid var(--border); width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 20px 0; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; }

        /* Верхняя панель */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .actions { display: flex; gap: 10px; }
        
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9em; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        /* Карточки заданий */
        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-text {
            font-size: 1.1em;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #f1f5f9;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ip-badge {
            background: #0f172a;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .task-delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }
        .task-delete-btn:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 0;
            font-size: 1.2em;
        }

        /* Навигация вкладок админки */
        .admin-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        .nav-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.05em;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-tab.active {
            background: var(--surface);
            color: #fff;
            border: 1px solid var(--border);
        }

        .report-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
        }

        .btn-ban {
            background: transparent;
            border: 1px solid #eab308;
            color: #facc15;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
        }
        .btn-ban:hover { background: #eab308; color: #000; }

        .btn-dismiss {
            background: transparent;
            border: 1px solid #10b981;
            color: #34d399;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85em;
            transition: 0.2s;
        }
        .btn-dismiss:hover { background: #10b981; color: #fff; }

        .blacklist-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
        }
        .blacklist-table th, .blacklist-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .blacklist-table th { background: #0f172a; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Экран логина -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>Вход для админа</h2>
            <input type="password" id="loginPassword" placeholder="Пароль администратора">
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- Основной дашборд -->
    <div class="container" id="adminContainer" style="display: none;">
        <header>
            <div>
                <h1>Панель управления</h1>
                <p style="color: var(--text-muted);">Заданий в базе: <span id="tasksCount" style="color: var(--accent); font-weight: bold;">0</span></p>
            </div>
            <div class="actions">
                <button class="btn btn-primary" onclick="refreshCurrentTab()">🔄 Обновить</button>
                <button class="btn btn-danger" onclick="logout()">Выйти</button>
            </div>
        </header>

        <!-- Вкладки меню -->
        <div class="admin-nav">
            <button class="nav-tab active" id="tabTasksBtn" onclick="switchTab('tasks')">📋 Все задания</button>
            <button class="nav-tab" id="tabReportsBtn" onclick="switchTab('reports')">🚨 Жалобы и Чёрный список</button>
        </div>

        <!-- Контент вкладки 1: Все задания -->
        <div id="tasksTabContent">
            <div id="tasksList"></div>
        </div>

        <!-- Контент вкладки 2: Жалобы и ЧС -->
        <div id="reportsTabContent" style="display: none;">
            <h2 style="margin-bottom: 15px; font-size: 1.3em;">⚠️ Задания с жалобами</h2>
            <div id="reportedTasksList"></div>

            <h2 style="margin: 35px 0 15px; font-size: 1.3em;">🚫 Заблокированные IP-адреса</h2>
            <div id="blacklistContainer"></div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('adminTaskToken');

        if (authToken) showAdmin();

        async function login() {
            const pass = document.getElementById('loginPassword').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });

            const data = await res.json();
            if (data.token) {
                authToken = data.token;
                localStorage.setItem('adminTaskToken', authToken);
                showAdmin();
            } else {
                alert('Неверный пароль!');
            }
        }

        function logout() {
            localStorage.removeItem('adminTaskToken');
            location.reload();
        }

        let currentTab = 'tasks';

        function showAdmin() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadTasks();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabTasksBtn').classList.toggle('active', tab === 'tasks');
            document.getElementById('tabReportsBtn').classList.toggle('active', tab === 'reports');
            document.getElementById('tasksTabContent').style.display = tab === 'tasks' ? 'block' : 'none';
            document.getElementById('reportsTabContent').style.display = tab === 'reports' ? 'block' : 'none';

            if (tab === 'tasks') loadTasks();
            else loadReportsAndBlacklist();
        }

        function refreshCurrentTab() {
            if (currentTab === 'tasks') loadTasks();
            else loadReportsAndBlacklist();
        }

        async function loadTasks() {
            try {
                const res = await fetch('/api/tasks', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.status === 401) {
                    alert('Сессия истекла, войдите заново');
                    return logout();
                }

                const tasks = await res.json();
                renderTasks(tasks);
            } catch (err) {
                console.error(err);
                alert('Ошибка загрузки заданий');
            }
        }

        function renderTasks(tasks) {
            document.getElementById('tasksCount').innerText = tasks.length;
            const container = document.getElementById('tasksList');

            if (!tasks.length) {
                container.innerHTML = '<div class="empty-state">Пока никто ничего не отправил 😴</div>';
                return;
            }

            container.innerHTML = tasks.map(task => {
                const date = new Date(task.created_at).toLocaleString('ru-RU');
                return `
                <div class="task-card" id="task-${task.id}">
                    <div class="task-text">${escapeHtml(task.text)}</div>
                    <div class="task-meta">
                        <div>
                            <span>🌐 IP: </span>
                            <span class="ip-badge" title="IP адрес отправителя">${escapeHtml(task.ip)}</span>
                            <span style="margin-left: 10px;">❤️ Лайков: <b>${task.likes_count || 0}</b></span>
                            ${task.reports_count > 0 ? `<span class="report-badge" style="margin-left: 8px;">⚠️ Жалоб: ${task.reports_count}</span>` : ''}
                            <span style="margin-left: 10px;">🕒 ${date}</span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            ${task.reports_count > 0 ? `<button class="btn-dismiss" onclick="resetReports(${task.id})">Снять жалобы ✓</button>` : ''}
                            <button class="btn-ban" onclick="banIp('${escapeHtml(task.ip)}')">Бан по IP</button>
                            <button class="task-delete-btn" onclick="deleteTask(${task.id})">Удалить ✕</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Загрузка заданий с жалобами и заблокированных IP
        async function loadReportsAndBlacklist() {
            try {
                const [repRes, blRes] = await Promise.all([
                    fetch('/api/admin/reports', { headers: { 'Authorization': `Bearer ${authToken}` } }),
                    fetch('/api/admin/blacklist', { headers: { 'Authorization': `Bearer ${authToken}` } })
                ]);

                if (repRes.status === 401) return logout();

                const reports = await repRes.json();
                const blacklist = await blRes.json();

                renderReportedTasks(reports);
                renderBlacklist(blacklist);
            } catch (err) {
                console.error(err);
                alert('Ошибка загрузки данных вкладки жалоб');
            }
        }

        function renderReportedTasks(tasks) {
            const container = document.getElementById('reportedTasksList');
            if (!tasks.length) {
                container.innerHTML = '<div style="color: var(--text-muted); padding: 15px 0;">Жалоб нет — всё спокойно ✨</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-card" id="rep-task-${task.id}">
                    <div class="task-text">${escapeHtml(task.text)}</div>
                    <div class="task-meta">
                        <div>
                            <span class="report-badge">⚠️ Жалоб: ${task.reports_count}</span>
                            <span style="margin-left: 10px;">🌐 IP автора: </span>
                            <span class="ip-badge">${escapeHtml(task.ip)}</span>
                        </div>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn-dismiss" onclick="resetReports(${task.id})">Снять жалобы ✓</button>
                            <button class="btn-ban" onclick="banIp('${escapeHtml(task.ip)}')">Забанить IP автора</button>
                            <button class="task-delete-btn" onclick="deleteTask(${task.id}, true)">Удалить задание ✕</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderBlacklist(banned) {
            const container = document.getElementById('blacklistContainer');
            if (!banned.length) {
                container.innerHTML = '<div style="color: var(--text-muted); padding: 15px 0;">Чёрный список пуст</div>';
                return;
            }

            container.innerHTML = `
                <table class="blacklist-table">
                    <thead>
                        <tr>
                            <th>IP адрес</th>
                            <th>Причина</th>
                            <th>Дата бана</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${banned.map(item => `
                            <tr id="banned-${encodeURIComponent(item.ip)}">
                                <td><span class="ip-badge">${escapeHtml(item.ip)}</span></td>
                                <td>${escapeHtml(item.reason || 'Нарушение')}</td>
                                <td>${new Date(item.created_at).toLocaleString('ru-RU')}</td>
                                <td><button class="task-delete-btn" onclick="unbanIp('${escapeHtml(item.ip)}')">Разбанить</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function resetReports(id) {
            if (!confirm('Обнулить жалобы на это задание?')) return;

            try {
                const res = await fetch(`/api/admin/tasks/${id}/reset-reports`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.ok) {
                    if (currentTab === 'reports') {
                        loadReportsAndBlacklist();
                    } else {
                        loadTasks();
                    }
                } else {
                    alert('Ошибка при сбросе жалоб');
                }
            } catch (e) {
                alert('Ошибка соединения с сервером');
            }
        }
        
        async function banIp(ip) {
            if (!confirm(`Добавить IP ${ip} в чёрный список? Пользователь больше не сможет отправлять задания.`)) return;

            const res = await fetch('/api/admin/blacklist', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ ip, reason: 'Жалоба на задание' })
            });

            if (res.ok) {
                alert(`IP ${ip} успешно заблокирован!`);
                if (currentTab === 'reports') loadReportsAndBlacklist();
            } else {
                alert('Ошибка при блокировке IP');
            }
        }

        async function unbanIp(ip) {
            if (!confirm(`Разбанить IP ${ip}?`)) return;

            const res = await fetch(`/api/admin/blacklist/${encodeURIComponent(ip)}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${authToken}` }
            });

            if (res.ok) {
                loadReportsAndBlacklist();
            } else {
                alert('Ошибка при разблокировке');
            }
        }

        async function deleteTask(id, isFromReports = false) {
            if (!confirm('Удалить это задание?')) return;

            const res = await fetch(`/api/tasks/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${authToken}` }
            });

            if (res.ok) {
                const el1 = document.getElementById(`task-${id}`);
                if (el1) el1.remove();
                const el2 = document.getElementById(`rep-task-${id}`);
                if (el2) el2.remove();

                const count = document.getElementById('tasksCount');
                if (count) count.innerText = Math.max(0, parseInt(count.innerText) - 1);
            } else {
                alert('Ошибка при удалении');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
